[package]
name = "settle-wasm"
version = "0.1.0"
edition = "2021"
description = "Minimum-transfer poker settlement algorithm, compiled to WebAssembly."
license = "MIT"

[lib]
# cdylib -> the .wasm artifact wasm-pack ships.
# rlib   -> lets `cargo test` run the native unit tests in this crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"   # optimise for size: this ships over the wire
lto = true
